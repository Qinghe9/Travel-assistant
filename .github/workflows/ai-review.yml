name: 代码自动审查

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态审查（注释到 diff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装 ruff
        run: python -m pip install --upgrade pip ruff
      - name: ruff（问题直接标注在 PR 改动行上；只提示不拦截，拦截交给 CI）
        run: ruff check --select E9,F63,F7,F82,F401,F841 --output-format=github --exit-zero .
      - name: 全量语法编译
        run: python -m compileall -q app scripts .github/scripts

  ai:
    name: AI 审查（DeepSeek）
    runs-on: ubuntu-latest
    needs: static
    # fork 来的 PR 拿不到仓库 Secret，直接跳过
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 生成并发送评审意见
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEW_API_BASE: ${{ vars.REVIEW_API_BASE || 'https://api.deepseek.com/v1' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'deepseek-chat' }}
        run: python .github/scripts/ai_review.py
