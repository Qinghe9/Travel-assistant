services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 可选：默认 local 模式不需要；设置 RAG_CHROMA_MODE=http 后再启用。
  chroma:
    image: chromadb/chroma:latest
    profiles: ["chroma"]
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped

volumes:
  chroma-data:
